name: Build and Test

on:
  push:
    branches: ['main']
    paths-ignore:
      - '*.md'
  pull_request:
    branches: ['main']
    paths-ignore:
      - '*.md'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Display dotnet version
        run: dotnet --version
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser tracker
        run: node --test tests/tracker.test.cjs
      - name: Restore dependencies
        working-directory: ./src
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./src
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: ./src
      - name: Test reporting without reflection serialization
        run: >-
          dotnet test ZoneTree.Analytics.UnitTests/ZoneTree.Analytics.UnitTests.csproj
          --configuration Release --no-restore
          -p:JsonSerializerIsReflectionEnabledByDefault=false
          --filter "FullyQualifiedName~ReportingSerializationTests|FullyQualifiedName~ReportingApiServesWebReports|FullyQualifiedName~ReportingApiRunsQueriesAndFunnels|FullyQualifiedName~ReportingApiSerializationFailure|FullyQualifiedName~ReportingApiCancelledSerialization"
          --verbosity minimal
        working-directory: ./src
